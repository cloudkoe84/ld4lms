    const IS_PREVIEW = false; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyMIV9EgPtkiG7MIBFsVB7j4SAtAyN53fWGivx7i2ty2TO9afKb89it3Y07yG9u21WEjQ/exec";

    // DATABASE CADANGAN/PREVIEW (Sesuai spesifikasi untuk Preview Mode)

      ],

        {

          video_url: "https://www.youtube.com/embed/W6NZfCO5SIk", 
          file_drive_url: "https://drive.google.com/file/d/1DummyFileMateriJS/view",

        }

      ]
    };

    // STATE UTAMA APLIKASI
    let state = {
      currentUser: null,
      activeView: "login", // login, guru_dashboard, siswa_dashboard
      activeSubView: "home", // home, materi, tugas, koreksi, siswa
      selectedItem: null 
    };

    async function callGAS(action, payload = {}) {
      if (IS_PREVIEW) {
        return null; // Dilewati jika dalam mode pratinjau lokal
      }
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({ action: action, data: payload })
        });
        if (!response.ok) {
          throw new Error("Respon jaringan gagal.");
        }
        return await response.json();
      } catch (error) {
        console.error("Kesalahan koneksi API GAS:", error);
        throw error;
      }
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `flex items-center gap-3 p-4 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto fade-in max-w-sm ${
        type === "success" 
          ? "bg-emerald-50 border-emerald-100 text-emerald-800" 
          : type === "error" 
          ? "bg-rose-50 border-rose-100 text-rose-800" 
          : "bg-teal-50 border-teal-100 text-teal-850"
      }`;

      const icon = type === "success" ? "check-circle" : type === "error" ? "alert-circle" : "info";
      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i>
        <div class="flex-1">${message}</div>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.remove("opacity-0", "translate-y-2");
      }, 10);

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // SCREEN ROUTING
    function switchView(view, subView = "home") {
      state.activeView = view;
      state.activeSubView = subView;
      renderApp();
    }

    // PROSES AUTENTIKASI MASUK
    async function handleLogin(username, password) {
      if (IS_PREVIEW) {
        const user = db.users.find(u => u.username === username && u.password === password);
        if (user) {
          state.currentUser = user;
          showToast(`Selamat datang kembali, ${user.nama_lengkap}`);
          if (user.role === "guru") {
            switchView("guru_dashboard", "home");
          } else {
            switchView("siswa_dashboard", "home");
          }
        } else {
          showToast("Kombinasi Username dan Password Anda tidak valid!", "error");
        }
      } else {
        showLoadingState(true, "Memvalidasi kredensial masuk...");
        try {
          const res = await callGAS("login", { username, password });
          showLoadingState(false);
          if (res && res.success) {
            state.currentUser = res.user;
            showToast(`Selamat datang kembali, ${res.user.nama_lengkap}`);
            if (res.user.role === "guru") {
              switchView("guru_dashboard", "home");
            } else {
              switchView("siswa_dashboard", "home");
            }
          } else {
            showToast(res ? res.message : "Gagal memproses autentikasi.", "error");
          }
        } catch (err) {
          showLoadingState(false);
          showToast("Koneksi API terputus atau URL salah.", "error");
        }
      }
    }

    function handleLogout() {
      state.currentUser = null;
      showToast("Anda telah keluar dari aplikasi.", "info");
      switchView("login");
    }

    function showLoadingState(show, text = "Memproses...") {
      const overlay = document.getElementById("loading-overlay");
      if (overlay) {
        if (show) {
          overlay.querySelector("p").innerText = text;
          overlay.classList.remove("hidden");
        } else {
          overlay.classList.add("hidden");
        }
      }
    }

            <p class="text-xs text-slate-400 mb-5">Periksa kesesuaian lampiran lalu berikan penilaian.</p>
            <div id="modal-nilai-content" class="space-y-4"></div>
          </div>
        </div>
      `;
    }

    function bukaModalPenilaian(id) {
      const item = db.pengumpulan_tugas.find(p => p.id === id);
      state.selectedItem = item;
      const modal = document.getElementById("modal-nilai");
      const content = document.getElementById("modal-nilai-content");

      content.innerHTML = `
        <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-sm border">
          <p class="text-slate-600"><strong>Nama Siswa:</strong> ${item.siswa_nama} (${item.siswa_kelas})</p>
          <p class="text-slate-600"><strong>Tugas:</strong> ${item.tugas_judul}</p>
          <p class="text-slate-600"><strong>Catatan Siswa:</strong> ${item.feedback || "-"}</p>
          <div class="pt-2">
            <a href="${item.file_tugas_url}" target="_blank" class="w-full text-center flex items-center justify-center gap-2 bg-emerald-50 border border-emerald-100 hover:bg-emerald-100 text-emerald-700 font-bold py-2.5 rounded-xl transition text-xs">
              <i data-lucide="external-link" class="w-4 h-4"></i> Buka File Jawaban Siswa
            </a>
          </div>
        </div>

        <form onsubmit="event.preventDefault(); simpanNilai();" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600">Skor Nilai (0-100)</label>
            <input type="number" id="v-nilai" min="0" max="100" value="${item.nilai}" required class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Contoh: 90">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600">Umpan Balik Guru</label>
            <textarea id="v-feedback" rows="3" required class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Tulis feedback evaluasi...">${item.feedback}</textarea>
          </div>
          <div class="flex gap-3">
            <button type="button" onclick="tutupModalPenilaian()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold py-3 rounded-xl transition">Batal</button>
            <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/15 transition">Simpan & Selesai</button>
          </div>
        </form>
      `;

      modal.classList.remove("hidden");
      modal.classList.add("flex");
      lucide.createIcons();
    }

    function tutupModalPenilaian() {
      const modal = document.getElementById("modal-nilai");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      state.selectedItem = null;
    }

    async function simpanNilai() {
      const nilai = document.getElementById("v-nilai").value;
      const feedback = document.getElementById("v-feedback").value;
      
      if (IS_PREVIEW) {
        state.selectedItem.nilai = nilai;
        state.selectedItem.feedback = feedback;
        state.selectedItem.status = "Selesai";
        showToast("Nilai tugas berhasil diperbarui!");
        tutupModalPenilaian();
        switchView("guru_dashboard", "koreksi");
      } else {
        showLoadingState(true, "Menyimpan penilaian...");
        try {
          const res = await callGAS("updateNilai", { submissionId: state.selectedItem.id, nilai, feedback });
          showLoadingState(false);
          if (res && res.success) {
            db.pengumpulan_tugas = res.pengumpulan_tugas;
            showToast("Nilai tugas berhasil diperbarui!");
            tutupModalPenilaian();
            switchView("guru_dashboard", "koreksi");
          }
        } catch (err) {
          showLoadingState(false);
          showToast("Gagal menyimpan data nilai.", "error");
        }
      }
    }

    function renderGuruSiswa() {
      const daftarSiswa = db.users.filter(u => u.role === "siswa");
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                      <th class="p-4">ID Siswa</th>
                      <th class="p-4">Nama Lengkap</th>
                      <th class="p-4">Kelas</th>
                      <th class="p-4">Username</th>
                      <th class="p-4 text-center">Aksi</th>

                  </thead>
                  <tbody class="divide-y divide-slate-100 text-sm">

                      <tr>

              <div>
                <label class="block text-xs font-semibold text-slate-600">Nama Lengkap</label>
                <input type="text" id="s-nama" required class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Nama lengkap siswa">

                <input type="text" id="s-kelas" required class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Contoh: XI-RPL-1">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600">Username Akun</label>
                <input type="text" id="s-username" required class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Username login">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600">Kata Sandi</label>
                <input type="text" id="s-password" required class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Kata sandi akun">
              </div>
              <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-600/10 transition">Simpan Data Siswa</button>
            </form>
          </div>
        </div>
      `;
    }

    async function simpanSiswa() {
      const nama_lengkap = document.getElementById("s-nama").value;
      const kelas = document.getElementById("s-kelas").value;
      const username = document.getElementById("s-username").value;
      const password = document.getElementById("s-password").value;
      const id = "U" + String(db.users.length + 1).padStart(3, '0');
      const newS = { id, username, password, nama_lengkap, role: "siswa", kelas };

      if (IS_PREVIEW) {
        db.users.push(newS);
        showToast("Akun siswa baru berhasil didaftarkan!");
        switchView("guru_dashboard", "siswa");
      } else {
        showLoadingState(true, "Mendaftarkan...");
        try {
          const res = await callGAS("addSiswa", newS);
          showLoadingState(false);
          if (res && res.success) {
            db.users = res.users;
            showToast("Akun siswa baru berhasil didaftarkan!");
            switchView("guru_dashboard", "siswa");
          }
        } catch (err) {
          showLoadingState(false);
          showToast("Gagal mendaftarkan akun siswa.", "error");
        }
      }
    }

    async function hapusSiswa(id) {
      if (IS_PREVIEW) {
        db.users = db.users.filter(u => u.id !== id);
        showToast("Data siswa berhasil dihapus.", "info");
        switchView("guru_dashboard", "siswa");
      } else {
        showLoadingState(true, "Menghapus data...");
        try {
          const res = await callGAS("deleteSiswa", { id });
          showLoadingState(false);
          if (res && res.success) {
            db.users = res.users;
            showToast("Data siswa berhasil dihapus.", "info");
            switchView("guru_dashboard", "siswa");
          }
        } catch (err) {
          showLoadingState(false);
          showToast("Gagal menghapus data siswa.", "error");
        }
      }
    }

      const ms = document.getElementById("mobile-sidebar-siswa");
      if (ms.classList.contains("opacity-0")) {
        ms.classList.remove("opacity-0", "pointer-events-none");
        ms.firstElementChild.classList.remove("-translate-x-full");
      } else {
        ms.classList.add("opacity-0", "pointer-events-none");
        ms.firstElementChild.classList.add("-translate-x-full");
      }
    }

      switch (state.activeSubView) {
        case "home": return renderSiswaHome();
        case "materi": return renderSiswaMateri();
        case "tugas": return renderSiswaTugas();
        default: return renderSiswaHome();
      }

                  ${item.file_drive_url ? `
                    <div class="pt-4 border-t border-slate-100 flex">
                      <a href="${item.file_drive_url}" target="_blank" class="w-full text-center flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs transition">
                        <i data-lucide="download-cloud" class="w-4 h-4"></i> Unduh Berkas Lampiran
                      </a>
                    </div>
                  ` : ""}
                </div>
              </div>
            `).join("")}
            ${db.materi.length === 0 ? `<p class="col-span-full text-slate-500 text-sm text-center py-12 bg-white rounded-2xl border border-dashed">Belum ada modul materi kelas.</p>` : ""}
          </div>
        </div>
      `;
    }

    function renderSiswaTugas() {
      return `
        <div class="space-y-6">
          <h3 class="text-lg font-bold text-slate-900">Tugas Mandiri Saya</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${db.tugas.map(item => {
              const submission = db.pengumpulan_tugas.find(p => p.tugas_id === item.id && p.siswa_id === state.currentUser.id);
              
              return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200/60 shadow-sm flex flex-col justify-between gap-5">
                  <div class="space-y-3">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                      <span class="text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-100 px-3 py-1 rounded-full flex items-center gap-1">
                        <i data-lucide="clock" class="w-3.5 h-3.5"></i> Batas: ${item.tenggat_waktu.replace('T', ' ')}
                      </span>
                      ${submission 
                        ? `<span class="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-full">Terkirim</span>`
                        : `<span class="text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-100 px-3 py-1 rounded-full">Belum Kirim</span>`
                      }
                    </div>

                    <h4 class="font-bold text-slate-800 text-md leading-snug">${item.judul}</h4>
                    <p class="text-sm text-slate-600 leading-relaxed">${item.deskripsi}</p>
                    
                    ${item.file_pendukung_url ? `
                      <a href="${item.file_pendukung_url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-600 hover:underline"><i data-lucide="link" class="w-3.5 h-3.5"></i> Berkas Pendukung Tugas</a>
                    ` : ""}
                  </div>

                  ${submission && submission.nilai ? `
                    <div class="p-4 rounded-xl bg-emerald-50/50 border border-emerald-100/50 space-y-2">
                      <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-emerald-800">Evaluasi Nilai:</span>
                        <span class="text-xl font-black text-emerald-700">${submission.nilai} / 100</span>
                      </div>
                      <p class="text-xs text-slate-500 italic">"${submission.feedback}"</p>
                    </div>
                  ` : submission && !submission.nilai ? `
                    <div class="p-3.5 rounded-xl bg-slate-50 border text-xs text-slate-400 italic text-center">
                      <i data-lucide="hourglass" class="w-4 h-4 inline-block mr-1.5 align-middle"></i> Sedang dalam penilaian guru...
                    </div>
                  ` : ""}

                  ${!submission ? `
                    <div class="pt-4 border-t border-slate-100">
                      <button onclick="bukaModalUploadTugas('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg shadow-emerald-600/15 transition flex items-center justify-center gap-1.5">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Kirim Berkas Tugas
                      </button>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
            ${db.tugas.length === 0 ? `<p class="col-span-full text-slate-500 text-sm text-center py-12 bg-white rounded-2xl border border-dashed">Tidak ada tugas aktif.</p>` : ""}
          </div>
        </div>

        <div id="modal-upload" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 relative max-h-[90vh] overflow-y-auto">
            <button onclick="tutupModalUploadTugas()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h3 class="text-lg font-bold text-slate-900 mb-1">Kirim Lembar Tugas</h3>
            <p class="text-xs text-slate-400 mb-5">Sistem akan otomatis mengirim dokumen ke Cloud Google Drive Guru.</p>
            <div id="modal-upload-content" class="space-y-4"></div>
          </div>
        </div>
      `;
    }

    function bukaModalUploadTugas(tugasId) {
      const item = db.tugas.find(t => t.id === tugasId);
      state.selectedItem = item;
      const modal = document.getElementById("modal-upload");
      const content = document.getElementById("modal-upload-content");

      content.innerHTML = `
        <div class="bg-slate-50 p-4 rounded-xl border space-y-1 text-sm mb-4">
          <p class="text-slate-800"><strong>Tugas:</strong> ${item.judul}</p>
          <p class="text-xs text-rose-600 font-semibold">Tenggat: ${item.tenggat_waktu.replace('T', ' ')}</p>
        </div>

        <form onsubmit="event.preventDefault(); prosesKirimTugas();" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 font-semibold">Pilih Berkas Tugas (PDF/Dokumen/Foto/PNG)</label>
            <div class="mt-1.5 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-200 border-dashed rounded-xl bg-slate-50/50 hover:bg-slate-50 transition cursor-pointer relative">
              <input type="file" id="u-file" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewSelectedFileName(this)">
              <div class="space-y-1 text-center pointer-events-none">
                <i data-lucide="upload" class="mx-auto h-10 w-10 text-slate-400"></i>
                <div class="flex text-xs text-slate-600">
                  <span class="relative font-bold text-emerald-600 hover:text-emerald-500">Klik untuk mencari file</span>
                </div>
                <p class="text-[10px] text-slate-400">Ukuran dokumen maks: 10MB</p>
              </div>
            </div>
            <div id="file-selected-name" class="mt-2 text-xs text-emerald-600 font-bold hidden"></div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600">Catatan/Pesan Tambahan ke Guru</label>
            <textarea id="u-catatan" rows="3" class="mt-1.5 block w-full border border-slate-200 rounded-xl bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" placeholder="Tulis catatan jika ada..."></textarea>
          </div>

          <div class="flex gap-3 pt-2">
            <button type="button" onclick="tutupModalUploadTugas()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold py-3 rounded-xl transition">Batal</button>
            <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/15 transition flex items-center justify-center gap-1.5">
              <i data-lucide="send" class="w-4 h-4"></i> Kirim Tugas
            </button>
          </div>
        </form>
      `;

      modal.classList.remove("hidden");
      modal.classList.add("flex");
      lucide.createIcons();
    }

    function previewSelectedFileName(input) {
      const nameDiv = document.getElementById("file-selected-name");
      if (input.files && input.files[0]) {
        nameDiv.innerText = `Berkas Terpilih: ${input.files[0].name}`;
        nameDiv.classList.remove("hidden");
      } else {
        nameDiv.classList.add("hidden");
      }
    }

    function tutupModalUploadTugas() {
      const modal = document.getElementById("modal-upload");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      state.selectedItem = null;
    }

    function prosesKirimTugas() {
      const fileInput = document.getElementById("u-file");
      const catatan = document.getElementById("u-catatan").value;
      const file = fileInput.files[0];
      const tgl = new Date().toISOString().replace('T', ' ').substring(0, 16);

      if (!file) {
        showToast("Mohon lampirkan dokumen tugas Anda!", "error");
        return;
      }

      if (IS_PREVIEW) {
        const mockP = {
          id: "P" + String(db.pengumpulan_tugas.length + 1).padStart(3, '0'),
          tugas_id: state.selectedItem.id,
          tugas_judul: state.selectedItem.judul,
          siswa_id: state.currentUser.id,
          siswa_nama: state.currentUser.nama_lengkap,
          siswa_kelas: state.currentUser.kelas,
          file_tugas_url: "https://drive.google.com/file/d/MockPreviewFile/view",
          nilai: "",
          feedback: "",
          tanggal_dikirim: tgl,
          status: "Belum Dinilai"
        };
        db.pengumpulan_tugas.unshift(mockP);
        showToast("Tugas berhasil terkirim!");
        tutupModalUploadTugas();
        switchView("siswa_dashboard", "tugas");
      } else {
        showLoadingState(true, "Mengonversi & mengunggah dokumen Anda ke Google Drive...");
        const reader = new FileReader();
        reader.onload = async function(e) {
          const base64Data = e.target.result.split(',')[1];
          const payload = {
            tugas_id: state.selectedItem.id,
            tugas_judul: state.selectedItem.judul,
            siswa_id: state.currentUser.id,
            siswa_nama: state.currentUser.nama_lengkap,
            siswa_kelas: state.currentUser.kelas,
            catatan: catatan,
            file_name: `${state.currentUser.nama_lengkap.replace(/\s+/g, '_')}_TUGAS_${Date.now()}.${file.name.split('.').pop()}`,
            file_mime: file.type,
            file_base64: base64Data,
            tanggal_dikirim: tgl
          };

          try {
            const res = await callGAS("submitTugas", payload);
            showLoadingState(false);
            if (res && res.success) {
              db.pengumpulan_tugas = res.pengumpulan_tugas;
              showToast("Tugas Anda berhasil diunggah ke Drive sekolah!");
              tutupModalUploadTugas();
              switchView("siswa_dashboard", "tugas");
            } else {
              showToast(res ? res.message : "Gagal mengunggah berkas.", "error");
            }
          } catch (err) {
            showLoadingState(false);
            showToast("Gagal terhubung ke penyimpanan Cloud.", "error");
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function renderApp() {
      const container = document.getElementById("app-content");
      
      switch (state.activeView) {
        case "login":
          container.innerHTML = renderLoginView();
          break;
        case "guru_dashboard":
          container.innerHTML = renderGuruDashboard();
          break;
        case "siswa_dashboard":
          container.innerHTML = renderSiswaDashboard();
          break;
        default:
          container.innerHTML = renderLoginView();
      }

      lucide.createIcons();
    }

    window.addEventListener("DOMContentLoaded", async function() {
      if (!IS_PREVIEW) {
        try {
          const res = await callGAS("getDashboardData");
          if (res && res.success) {
            db = res.db;
            showToast("Sinkronisasi berhasil", "success");
            renderApp();
          } else {
            showToast("Memuat cadangan database pratinjau lokal.", "info");
            renderApp();
          }
        } catch (err) {
          showToast("Koneksi API GAS gagal. Menggunakan data pratinjau.", "info");
          renderApp();
        }
      } else {
        setTimeout(() => {
          renderApp();
        }, 800);
      }
    });
  </script>
</body>
</html>
